name: Migrate Production DB

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch whose supabase/migrations/ to push to production'
        required: true
        default: 'main'
      confirm:
        description: 'Type "migrate" to confirm you want to apply pending migrations to production'
        required: true
      dry_run:
        description: 'Only connect and list pending migrations; do not apply them'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [supabase/migrations/**]

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Check confirmation input
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm != 'migrate'
        run: |
          echo "Confirmation input did not match 'migrate' — aborting."
          exit 1

      - name: Show target branch
        run: echo "Pushing migrations from branch '${{ github.event.inputs.branch || github.ref_name }}' to production."

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}

      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0

      - name: Link to production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Test database connection
        run: |
          # CLI v3 targets the LOCAL stack by default, even after `link` —
          # every database command here needs --remote.
          if ! supabase migration list --remote --password "$SUPABASE_DB_PASSWORD"; then
            echo "❌ Could not connect to the production database — see the CLI error above."
            exit 1
          fi
          echo "✓ Database connection OK."
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Show pending migrations (dry run)
        run: supabase db push --remote --password "$SUPABASE_DB_PASSWORD" --dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Push migrations to production
        if: github.event.inputs.dry_run != 'true'
        run: supabase db push --remote --password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
