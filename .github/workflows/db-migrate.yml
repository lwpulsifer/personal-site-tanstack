name: Migrate Production DB

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch whose supabase/migrations/ to push to production'
        required: true
        default: 'main'
      confirm:
        description: 'Type "migrate" to confirm you want to apply pending migrations to production'
        required: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Check confirmation input
        if: github.event.inputs.confirm != 'migrate'
        run: |
          echo "Confirmation input did not match 'migrate' — aborting."
          exit 1

      - name: Show target branch
        run: echo "Pushing migrations from branch '${{ github.event.inputs.branch }}' to production."

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Test database connection
        run: |
          if ! supabase migration list > /dev/null; then
            echo "❌ Could not connect to the production database — check SUPABASE_DB_PASSWORD and SUPABASE_PROJECT_REF."
            exit 1
          fi
          echo "✓ Database connection OK."
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Show pending migrations (dry run)
        run: supabase db push --dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Push migrations to production
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
